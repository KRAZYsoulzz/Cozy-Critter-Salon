<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>html,body{margin:0;height:100%;background:#2a1a33;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}

<canvas id="stage"></canvas><div id="coins">🪙 <span id="coin-n">0</span></div><button id="prompt"></button>
